<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Co-o creativo | Productora audiovisual</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="Productora audiovisual. Fotografía y video para marcas en Colombia y Latinoamérica que buscan narrativas originales. Menos poses, más realismo mágico.">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Exo:wght@400;500;600;700&family=Quicksand:wght@400;500;600&display=swap" rel="stylesheet">

  <style>
    :root{
      --bg:#F5DED8;
      --bg-soft:#F4B8A6;
      --card-bg:#fff;
      --text:#3F0D2C;
      --muted:#926799;
      --accent:#BD4B4D;
      --accent-soft:#D6989B;
      --border-subtle:rgba(63, 13, 44, 0.12);
      --radius-lg:24px;
      --radius-md:18px;
      --radius-pill:999px;
      --shadow-soft:0 26px 70px rgba(0,0,0,0.18);
      --max-width:1120px;

      --header-h:104px;
    }

    *{box-sizing:border-box;margin:0;padding:0}
    html{scroll-behavior:smooth}
    body{
      font-family:"Quicksand",system-ui,-apple-system,BlinkMacSystemFont,sans-serif;
      background: radial-gradient(circle at top, var(--bg-soft) 0, var(--bg) 40%, #ffffff 80%);
      color:var(--text);
      -webkit-font-smoothing:antialiased;
      line-height:1.6;
    }
    a{color:inherit;text-decoration:none}
    img{max-width:100%;display:block}
    .container{max-width:var(--max-width);margin:0 auto;padding:0 20px;width:100%}

    /* HEADER */
    .site-header{
      position:sticky;top:0;z-index:40;
      backdrop-filter:blur(20px);
      background:rgba(245,222,216,.94);
      border-bottom:1px solid rgba(63, 13, 44, 0.06);
    }
    .nav-inner{display:flex;align-items:center;justify-content:space-between;height:var(--header-h)}
    .logo{display:inline-flex;align-items:center;gap:12px}

    /* Logo grande (x2 aprox) */
    .brand-logo{
      height:92px;
      width:auto;
      object-fit:contain;
      filter: drop-shadow(0 10px 26px rgba(0,0,0,0.22));
    }

    .nav-right{display:flex;align-items:center;gap:14px}

    .nav-links{display:flex;align-items:center;gap:22px;font-size:.92rem;color:var(--muted)}
    .nav-links a{
      position:relative;
      padding:4px 0;
      transition:color .16s ease;
      font-family:"Exo",system-ui,sans-serif;
      font-weight:700; /* ✅ Trabajos + Nosotros en bold */
    }
    .nav-links a::after{
      content:"";position:absolute;left:0;bottom:-4px;width:0;height:2px;border-radius:999px;
      background:linear-gradient(90deg,var(--accent-soft),var(--accent));
      transition:width .16s ease;
    }
    .nav-links a:hover{color:var(--text)}
    .nav-links a:hover::after{width:100%}

    /* CTA en header */
    .nav-cta{
      padding:12px 30px;              /* ✅ más holgura lateral */
      border-radius:var(--radius-pill);
      border:1px solid rgba(63,13,44,.18);
      background:rgba(255,255,255,.72);
      display:inline-flex;align-items:center;gap:10px;
      font-size:.9rem;font-weight:700;color:var(--text);
      min-height:46px;
      line-height:1.1;
      white-space:nowrap;              /* ✅ evita que se pise */
    }
    .nav-cta::after{display:none}      /* para que no herede underline */
    .nav-cta-dot{width:7px;height:7px;border-radius:999px;background:#30d158;box-shadow:0 0 12px rgba(48,209,88,.7)}

    /* Switch idioma */
    .lang-switch{
      display:inline-flex;
      border:1px solid rgba(63,13,44,.16);
      background:rgba(255,255,255,.55);
      border-radius:999px;
      padding:5px;
      gap:6px;
    }
    .lang-btn{
      appearance:none;border:0;cursor:pointer;
      padding:8px 12px;
      border-radius:999px;
      font-family:"Exo",system-ui,sans-serif;
      font-weight:800;
      font-size:.78rem;
      color:var(--muted);
      background:transparent;
      transition:background .16s ease, color .16s ease, transform .12s ease;
    }
    .lang-btn:hover{transform:translateY(-1px)}
    .lang-btn.active{
      color:var(--text);
      background:rgba(255,255,255,.92);
      box-shadow:0 16px 40px rgba(0,0,0,.12);
    }

    .nav-toggle{
      display:none;width:36px;height:36px;border-radius:999px;
      border:1px solid rgba(63,13,44,.2);
      background:rgba(245,222,216,.96);
      align-items:center;justify-content:center;cursor:pointer;
    }
    .nav-toggle span{width:18px;height:2px;background:var(--text);border-radius:999px;position:relative}
    .nav-toggle span::before,.nav-toggle span::after{
      content:"";position:absolute;left:0;width:18px;height:2px;background:var(--text);border-radius:999px
    }
    .nav-toggle span::before{top:-5px}
    .nav-toggle span::after{top:5px}

    /* SECTIONS */
    section{padding:56px 0}
    .section-header{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;margin-bottom:32px}
    .section-eyebrow{
      font-family:"Exo",system-ui,sans-serif;font-size:.78rem;text-transform:uppercase;
      letter-spacing:.16em;color:var(--muted);margin-bottom:6px;
    }
    .section-title{font-family:"Exo",system-ui,sans-serif;font-size:1.7rem;letter-spacing:-.03em}
    .section-description{font-size:.9rem;color:var(--muted);max-width:420px}

    /* HERO */
    .hero{padding:72px 0 72px}

    /* ✅ más separación texto vs reel */
    .hero-inner{
      display:grid;
      grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);
      gap:76px;
      align-items:center
    }
    .hero-eyebrow{
      font-family:"Exo",system-ui,sans-serif;font-size:.74rem;text-transform:uppercase;
      letter-spacing:.18em;color:var(--muted);margin-bottom:14px
    }
    .hero-title{
      font-family:"Exo",system-ui,sans-serif;
      font-size:clamp(2.3rem,4vw,3.3rem);
      line-height:1.05;letter-spacing:-.04em;margin-bottom:16px
    }
    .hero-title span{color:var(--accent)}
    .hero-subtitle{font-size:.98rem;color:var(--muted);max-width:36rem;margin-bottom:28px}
    .hero-actions{display:flex;flex-wrap:wrap;gap:14px;margin-bottom:20px}
    .btn{
      display:inline-flex;align-items:center;justify-content:center;gap:8px;
      padding:12px 22px;border-radius:var(--radius-pill);
      border:none;font-size:.92rem;font-weight:700;cursor:pointer;
      transition:transform .1s ease, box-shadow .18s ease, background .18s ease;
    }
    .btn-primary{
      background:linear-gradient(90deg,var(--accent-soft),var(--accent));
      color:#fff5f5;box-shadow:var(--shadow-soft)
    }
    .btn-primary:hover{transform:translateY(-1px);box-shadow:0 30px 80px rgba(0,0,0,.28)}
    .btn-ghost{
      background:rgba(255,255,255,.72);
      color:var(--text);
      border:1px solid rgba(63,13,44,.2)
    }
    .btn-ghost:hover{background:#fff;transform:translateY(-1px)}
    .hero-meta{font-size:.82rem;color:var(--muted)}
    .hero-dot{width:8px;height:8px;border-radius:999px;background:var(--accent-soft);margin-right:6px;display:inline-block}

    /* HERO MEDIA (recto, sin borde blanco) */
    .hero-media{border-radius:0;background:transparent;border:0;padding:0;box-shadow:none}
    .hero-media-inner{
      border-radius:0;background:#111;position:relative;overflow:hidden;aspect-ratio:16/9;width:100%;
    }
    .hero-reel{position:absolute;inset:0;width:100%;height:100%;border:0}

    /* CLIENT LOGOS */
    .clients{
      padding:34px 0 10px;
      background:rgba(255,255,255,.55);
      border-top:1px solid rgba(63,13,44,.06);
      border-bottom:1px solid rgba(63,13,44,.06);
    }
    .clients-inner{display:flex;flex-direction:column;gap:14px}
    .clients-title{
      font-family:"Exo",system-ui,sans-serif;font-size:.78rem;text-transform:uppercase;
      letter-spacing:.16em;color:var(--muted)
    }
    .logos{
      display:grid;
      grid-template-columns:repeat(7, minmax(0,1fr));
      gap:12px;
    }
    .logo-box{
      border:1px solid rgba(63,13,44,.10);
      background:rgba(255,255,255,.85);
      border-radius:14px;
      height:64px;
      padding:12px 18px;
      display:flex;align-items:center;justify-content:center;
      overflow:hidden;
    }
    .logo-box img{
      height:30px;width:auto;max-width:100%;object-fit:contain;
      filter: grayscale(100%);opacity:.78;
      transition:opacity .2s ease, transform .2s ease, filter .2s ease;
    }
    .logo-box:hover img{opacity:1;transform:translateY(-1px);filter:grayscale(0%)}

    /* WORK */
    .work{
      border-top:1px solid rgba(63,13,44,.08);
      border-bottom:1px solid rgba(63,13,44,.06);
      background:linear-gradient(to bottom,#fff 0,#F5DED8 50%,#fff 100%);
    }
    .work-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}
    .project-card{
      background:var(--card-bg);
      border-radius:var(--radius-md);
      border:1px solid var(--border-subtle);
      overflow:hidden;
      display:flex;flex-direction:column;
      cursor:pointer;outline:none;
      transition:transform .16s ease, box-shadow .16s ease, border-color .16s ease;
    }
    .project-media{position:relative;aspect-ratio:16/9;background:#1a0d16;overflow:hidden}
    .project-media img{
      position:absolute;inset:0;width:100%;height:100%;
      object-fit:cover;transform:scale(1.02);transition:transform .25s ease;
    }
    .project-media::after{
      content:"";position:absolute;inset:0;
      background:linear-gradient(to top, rgba(0,0,0,.55), rgba(0,0,0,0) 60%);
      pointer-events:none;
    }
    .project-chip{
      position:absolute;left:12px;top:12px;padding:4px 10px;border-radius:var(--radius-pill);
      background:rgba(245,222,216,.96);border:1px solid rgba(63,13,44,.2);
      font-size:.7rem;text-transform:uppercase;letter-spacing:.12em;color:var(--muted);z-index:2;
    }
    .project-body{padding:12px 14px 14px;display:flex;flex-direction:column;gap:4px;font-size:.86rem}
    .project-title{font-family:"Exo",system-ui,sans-serif;font-size:.98rem;letter-spacing:-.02em}
    .project-meta{font-size:.8rem;color:var(--muted)}
    .project-logline{font-size:.82rem;color:var(--muted);margin-top:4px}
    .project-card:hover,.project-card:focus-visible{
      transform:translateY(-4px);
      box-shadow:var(--shadow-soft);
      border-color:rgba(63,13,44,.18)
    }
    .project-card:hover .project-media img,.project-card:focus
